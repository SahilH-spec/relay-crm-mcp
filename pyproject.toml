[project]
name = "relay-crm-mcp"
version = "0.1.0"
description = "An MCP server that turns a Salesforce org into an AI sales workspace inside Claude."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sahil Khan" }]
dependencies = [
    "mcp[cli]>=2.0,<3",
    "simple-salesforce>=1.12,<2",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.scripts]
relay-server = "relay.server:main"
relay-check = "relay.check_connection:main"
relay-seed = "relay.seed:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
